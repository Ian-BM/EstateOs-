server {
    listen 80;
    listen [::]:80;
    server_name afyasoft.co.tz www.afyasoft.co.tz;
    return 301 https://afyasoft.co.tz$request_uri;
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.afyasoft.co.tz;
    ssl_certificate /etc/letsencrypt/live/afyasoft.co.tz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/afyasoft.co.tz/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    return 301 https://afyasoft.co.tz$request_uri;
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name afyasoft.co.tz;
    ssl_certificate /etc/letsencrypt/live/afyasoft.co.tz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/afyasoft.co.tz/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    client_max_body_size 10m;
    location /static/ {
        alias /srv/estate-os/current/staticfiles/;
        expires 7d;
        add_header X-Content-Type-Options nosniff always;
    }
    location /media/ { return 404; }
    location / {
        proxy_pass http://127.0.0.1:8010;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_redirect off;
        proxy_read_timeout 65s;
    }
}
